# Render Blueprint — provisions the web service. The database lives on Supabase.
# Push this repo to GitHub, then in Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: virtualedge
    runtime: node
    plan: starter                  # paid (~$7/mo): always-on, no cold-start sleep
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false                  # Supabase "Session pooler" connection string (Connect button in Supabase)
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: ADMIN_ACCOUNTS
        sync: false                  # extra admin sign-ins: "email:password,email2:password2"
      - key: ADMIN_PASSCODE
        sync: false                  # legacy passcode API login; disabled unless set
      - key: ANTHROPIC_API_KEY
        sync: false                  # set this yourself in the dashboard (screenshot scanning, Claude vision)
      - key: RESEND_API_KEY
        sync: false                  # set this yourself (email confirmations); blank = emails off
      - key: MAIL_FROM
        sync: false                  # e.g. "Virtual Oracle <noreply@yourdomain.com>"
      - key: DATABASE_SSL
        value: "on"
