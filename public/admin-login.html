<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportyHacks — Admin Login</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root{
    --night:#06100B; --pitch:#0A1A12; --panel:#0F2219; --panel2:#132A20; --panel3:#18342A;
    --line:#1F3A2E; --line2:#2B4A3C; --text:#EAF5EE; --mut:#8FA89A; --dim:#5E7568;
    --lime:#C8FF3D; --lime-deep:#9BD11A; --coral:#FF5B4A; --ink-on-lime:#0B1511;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:var(--rc-body,'Manrope',system-ui,sans-serif);color:var(--text);
    background:radial-gradient(900px 420px at 50% 0%,rgba(200,255,61,.08),transparent 60%),var(--night);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  /* dark top bar, like the landing nav */
  .top{
    background:rgba(6,16,11,.78);backdrop-filter:blur(14px);color:var(--text);padding:14px 22px;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(214,255,228,.10);
  }
  .top .di{font-size:13px;color:var(--lime);text-shadow:0 0 12px rgba(200,255,61,.5)}
  .top .brand{font-family:var(--rc-display,'Bricolage Grotesque',system-ui,sans-serif);font-weight:800;font-size:17px;letter-spacing:.06em}
  .top a{margin-left:auto;color:var(--mut);font-size:12.5px;font-weight:700;
    letter-spacing:.02em;text-decoration:none;border:1.5px solid rgba(234,245,238,.22);
    border-radius:999px;padding:7px 14px;white-space:nowrap;transition:.15s}
  .top a:hover{color:var(--lime);border-color:var(--lime);background:transparent}

  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:26px 16px}
  .card{
    width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:18px;
    padding:34px 28px;text-align:center;box-shadow:0 24px 60px -24px rgba(0,0,0,.75);
  }
  .lock-ic{
    width:54px;height:54px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
    background:rgba(200,255,61,.10);border:1px solid rgba(200,255,61,.25);color:var(--lime);font-size:22px;
  }
  h1{font-family:var(--rc-display,'Bricolage Grotesque',system-ui,sans-serif);font-weight:800;font-size:24px;letter-spacing:-.02em;margin-bottom:6px;color:var(--text)}
  .sub{font-size:13.5px;color:var(--mut);margin-bottom:22px}
  .err{
    display:none;background:rgba(255,91,74,.12);border:1px solid rgba(255,91,74,.35);border-radius:10px;
    color:var(--coral);font-size:12.5px;font-weight:600;padding:10px 12px;margin-bottom:14px;
  }
  .err.show{display:block}
  .pw-wrap{position:relative;margin-bottom:16px}
  input{
    width:100%;background:var(--pitch);border:1px solid var(--line2);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:16px;padding:13px 44px 13px 14px;
    text-align:center;letter-spacing:.25em;outline:none;transition:.15s;
  }
  input::placeholder{color:var(--dim)}
  input:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,255,61,.14);background:var(--pitch)}
  .pw-toggle{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:4px;
  }
  .pw-toggle:hover{color:var(--text)}
  button.go{
    width:100%;background:var(--lime);color:var(--ink-on-lime);
    border:1px solid var(--lime);border-radius:999px;font-family:inherit;
    letter-spacing:.02em;font-size:15px;font-weight:800;padding:14px;cursor:pointer;transition:.16s;
    box-shadow:0 8px 24px -10px rgba(200,255,61,.55);
  }
  button.go:hover{background:#D8FF6E;box-shadow:0 10px 34px -6px rgba(200,255,61,.55)}
  button.go:disabled{opacity:.55;pointer-events:none}
  .foot{padding:16px;text-align:center;font-family:var(--rc-mono,'JetBrains Mono',monospace);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim)}
</style>
<link rel="stylesheet" href="ch-theme.css">
</head>
<body>

<div class="top">
  <span class="di">◆</span><span class="brand">SPORTYHACKS</span>
  <a href="index.html">← Back to site</a>
</div>

<div class="wrap">
  <div class="card">
    <div class="lock-ic">🔒</div>
    <h1>Admin Access</h1>
    <p class="sub">Sign in with your admin email and password.</p>
    <div class="err" id="err"></div>
    <input type="email" id="email" placeholder="admin@gmail.com" autocomplete="username"
           style="margin-bottom:12px;text-align:left;letter-spacing:normal"
           onkeydown="if(event.key==='Enter')doUnlock()">
    <div class="pw-wrap">
      <input type="password" id="pass" placeholder="Password" autocomplete="current-password"
             style="text-align:left;letter-spacing:normal"
             onkeydown="if(event.key==='Enter')doUnlock()">
      <button class="pw-toggle" type="button" onclick="togglePw()">👁</button>
    </div>
    <button class="go" id="go" onclick="doUnlock()">Sign in</button>
  </div>
</div>

<div class="foot">SportyHacks · Restricted area</div>

<script src="api.js"></script>
<script>
"use strict";
const err = document.getElementById('err');

/* Already signed in → straight to the dashboard (it bounces back here if the
   token has expired). ?expired=1 explains why the dashboard sent us back. */
(function init(){
  const q = new URLSearchParams(location.search);
  if(q.get('expired')){
    err.textContent = 'Session expired — enter the passcode again.';
    err.classList.add('show');
  } else if(VE.isAdmin()){
    location.replace('admin.html');
    return;
  }
  document.getElementById('email').focus();
})();

function togglePw(){
  const el = document.getElementById('pass');
  el.type = el.type === 'password' ? 'text' : 'password';
}

async function doUnlock(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('go');
  err.classList.remove('show');
  if(!email || !pass){ err.textContent = 'Enter your email and password.'; err.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    await VE.adminLogin(email, pass);
    location.replace('admin.html');
  } catch(e){
    err.textContent = e.message || 'Wrong email or password.';
    err.classList.add('show');
    document.getElementById('pass').value = '';
    document.getElementById('pass').focus();
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}
</script>
</body>
</html>
